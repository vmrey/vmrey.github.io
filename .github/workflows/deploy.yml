name: Deploy vmrey.github.io to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# 赋予部署 GitHub Pages 的最小所需权限
permissions:
  contents: read
  pages: write
  id-token: write

# 避免并发部署冲突
concurrency:
  group: "pages"
  cancel-in-progress: false

# 显式指定 Actions 运行环境使用 Node.js 24，消除 Node 20 弃用警告
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 GitHub Pages 环境
        uses: actions/configure-pages@v5

      - name: 上传全站静态资源产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 正式发布上线到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
